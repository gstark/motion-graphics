<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Stacked Frame app icon: a graphics band above, a video (play) below,
       on a blue squircle. The rounded rect is inset ~100px to match the
       macOS icon grid, with a soft cast shadow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5aa0ff"/>
      <stop offset="0.55" stop-color="#3568ef"/>
      <stop offset="1" stop-color="#1c46c8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.04" r="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef3ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#0a1330" flood-opacity="0.34"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b1440" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Squircle -->
  <g filter="url(#shadow)">
    <rect x="104" y="104" width="816" height="816" rx="184" fill="url(#bg)"/>
    <rect x="104" y="104" width="816" height="816" rx="184" fill="url(#glow)"/>
  </g>

  <!-- Graphics band (top): the motion-graphics layer -->
  <g filter="url(#soft)">
    <rect x="300" y="300" width="424" height="150" rx="34" fill="url(#band)"/>
  </g>
  <rect x="336" y="342" width="196" height="26" rx="13" fill="#2f5fe0"/>
  <rect x="336" y="386" width="120" height="20" rx="10" fill="#9db6f2"/>
  <circle cx="672" cy="375" r="30" fill="#f0a52b"/>

  <!-- Video layer (below): a play triangle -->
  <path d="M436 512 L436 720 L628 616 Z" fill="#ffffff" filter="url(#soft)"/>
</svg>
